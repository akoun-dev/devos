name: DevOS validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate Prisma schema
        run: bunx prisma validate
      - name: Generate Prisma client
        run: bun run db:generate
      - name: Synchronize isolated CI SQLite database
        run: bunx prisma db push --skip-generate
      - name: ESLint
        run: bun run lint
      - name: TypeScript
        run: bunx tsc --noEmit
